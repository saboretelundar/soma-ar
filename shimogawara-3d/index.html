<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>下河原吹屋 3D</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.0.0/dist/model-viewer.min.js"></script>
<style>
  :root { --bg:#f4efe1; --ink:#3b372c; --sub:#6b6655; --line:#cfc6ae; --accent:#9c3b26; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--ink);
    font:14px/1.6 "Noto Sans JP", system-ui, sans-serif; }
  model-viewer { position:fixed; inset:0; width:100%; height:100%; background:var(--bg); --poster-color:var(--bg); }
  header { position:fixed; top:0; left:0; right:0; padding:12px 16px 8px; pointer-events:none;
    background:linear-gradient(var(--bg) 60%, transparent); }
  h1 { font-size:16px; margin:0; }
  .note { font-size:12px; color:var(--sub); margin:2px 0 0; }
  .note b { color:var(--accent); font-weight:600; }
  footer { position:fixed; left:0; right:0; bottom:0; padding:10px 16px calc(14px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:8px; align-items:stretch;
    background:linear-gradient(transparent, var(--bg) 35%); }
  .modes { display:flex; gap:6px; }
  .modes button { flex:1; font:inherit; font-size:13px; padding:8px 6px; border-radius:6px;
    border:1px solid var(--line); background:#fffdf7; color:var(--ink); }
  .modes button[aria-pressed=true] { border-color:var(--ink); background:var(--ink); color:#fffdf7; }
  #how { font-size:12px; color:var(--sub); margin:0; min-height:3.2em; }
  #ar { font:inherit; font-size:15px; font-weight:600; padding:12px; border-radius:8px; border:none;
    background:var(--accent); color:#fff; }
  #noar, #loading { font-size:12px; color:var(--sub); text-align:center; margin:0; }
  #status { font-size:12px; color:var(--accent); margin:0; }
</style>
</head>
<body>
<model-viewer id="mv"
  src="shimogawara-open-mini.glb"
  alt="下河原吹屋の想定復元（3Dモデル）"
  ar ar-modes="webxr scene-viewer quick-look" ar-scale="fixed" ar-placement="floor"
  camera-controls touch-action="pan-y" interaction-prompt="none"
  camera-orbit="-35deg 62deg auto" camera-target="auto auto auto"
  min-camera-orbit="auto 10deg auto" max-camera-orbit="auto 88deg auto"
  shadow-intensity="0.6" exposure="1.05" tone-mapping="neutral">
  <div slot="ar-button" hidden></div>
</model-viewer>

<header>
  <h1>下河原吹屋 3D（試作）</h1>
  <p class="note"><b>推測に基づく想定復元</b>であり、復元ではありません。1601〜1613年頃の吹屋を、発掘報告と同時代の資料から組み立てた3Dモデルです。</p>
</header>

<footer>
  <div class="modes" role="group" aria-label="表示">
    <button data-mode="open" aria-pressed="true">屋根を外して中を見る</button>
    <button data-mode="roof" aria-pressed="false">屋根あり</button>
  </div>
  <div class="modes" role="group" aria-label="大きさ">
    <button data-size="mini" aria-pressed="true">模型（1/30・机の上）</button>
    <button data-size="full" aria-pressed="false">実寸（屋外の広場）</button>
  </div>
  <button id="ar" hidden>ARで置く</button>
  <p id="how"></p>
  <p id="loading">読み込み中…（約8MB）</p>
  <p id="status" hidden></p>
  <p id="noar" hidden>この端末ではARを起動できません。スマートフォン（iPhone の Safari／Android の Chrome）で開いてください。</p>
</footer>

<script type="module">
const mv = document.getElementById('mv');
const MODES = {
  open: { file: 'shimogawara-open', how: '屋根を外した状態です。指で回すと作業場の様子が見えます。' },
  roof: { file: 'shimogawara-roof', how: '屋根のある外観です。' },
};
const SIZES = {
  mini: { suffix: '-mini', scale: 'auto',  how: 'ARでは1/30の模型（長さ約70cm）を机や床に置きます。2本指で拡大縮小・回転できます。' },
  full: { suffix: '',      scale: 'fixed', how: 'ARでは実寸（12m×21.6m）で置きます。建屋の中心が置く点です。広い場所で、置いたあと10mほど下がると全体が見えます。' },
};
let mode = 'open', size = 'mini';
function apply() {
  const c = MODES[mode], s = SIZES[size];
  document.getElementById('loading').hidden = false;
  mv.setAttribute('ar-scale', s.scale);
  mv.src = c.file + s.suffix + '.glb';   // iPhone/iPad は model-viewer が GLB から USDZ を自動生成して AR Quick Look を開く
  document.getElementById('how').textContent = c.how + s.how;
  document.querySelectorAll('[data-mode]').forEach(b => b.setAttribute('aria-pressed', b.dataset.mode === mode));
  document.querySelectorAll('[data-size]').forEach(b => b.setAttribute('aria-pressed', b.dataset.size === size));
}
document.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { mode = b.dataset.mode; apply(); });
document.querySelectorAll('[data-size]').forEach(b => b.onclick = () => { size = b.dataset.size; apply(); });
apply();

const arBtn = document.getElementById('ar');
mv.addEventListener('load', () => {
  document.getElementById('loading').hidden = true;
  arBtn.hidden = !mv.canActivateAR;
  document.getElementById('noar').hidden = mv.canActivateAR;
});
mv.addEventListener('error', () => { const l = document.getElementById('loading'); l.hidden = false; l.textContent = 'モデルを読み込めませんでした。'; });
arBtn.addEventListener('click', () => mv.activateAR());
mv.addEventListener('ar-status', e => {
  const s = document.getElementById('status');
  if (e.detail.status === 'failed') { s.hidden = false; s.textContent = 'ARを開始できませんでした。明るい場所で、地面を映しながらもう一度お試しください。'; }
  else s.hidden = true;
});
</script>
</body>
</html>
