<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#16150F">
<title>清水谷製錬所 現地AR｜明治28年</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; height: 100%; overflow: hidden;
    background: #16150F; color: #E7E3D4;
    font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", Meiryo, system-ui, sans-serif;
    overscroll-behavior: none;
  }
  #view { position: fixed; inset: 0; }
  #cam, #cv { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #cam { object-fit: cover; background: #000; }
  #cv { touch-action: none; }

  #status {
    position: fixed; left: 12px; right: 12px; top: calc(10px + env(safe-area-inset-top));
    z-index: 20; padding: 9px 14px; border-radius: 4px;
    background: rgba(22,21,15,.82); backdrop-filter: blur(6px);
    font-size: 13px; line-height: 1.55; text-align: center;
  }
  #status b { color: #D98B44; font-weight: 500; }
  #status.hide { display: none; }

  #panel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: rgba(22,21,15,.90); backdrop-filter: blur(8px);
    border-top: 1px solid #3A3727;
    padding: 10px 16px calc(12px + env(safe-area-inset-bottom));
    transition: transform .22s ease;
  }
  #panel.collapsed { transform: translateY(calc(100% - 44px)); }

  #handle {
    display: flex; align-items: center; justify-content: space-between;
    height: 34px; cursor: pointer; user-select: none;
  }
  #handle span { font-size: 13px; color: #B3AE97; }
  #handle b { font-size: 12px; color: #D98B44; font-weight: 500; }

  .row { display: grid; grid-template-columns: 62px 1fr 44px; align-items: center; gap: 10px; margin-top: 8px; }
  .row label { font-size: 13px; color: #B3AE97; }
  .row output { font-size: 12px; color: #8B8770; text-align: right; font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: #D98B44; height: 26px; }

  .btns { display: flex; gap: 8px; margin-top: 12px; }
  .btns button {
    flex: 1; appearance: none; border: 1px solid #3A3727; background: transparent;
    color: #E7E3D4; font-family: inherit; font-size: 13px;
    padding: 10px 6px; border-radius: 4px; cursor: pointer;
  }
  .btns button:active { background: #2A281C; }
  .btns button.on { border-color: #D98B44; color: #D98B44; }

  #gate {
    position: fixed; inset: 0; z-index: 50; display: none;
    flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 32px; text-align: center; background: #16150F;
  }
  #gate.show { display: flex; }
  #gate h1 { font-size: 18px; font-weight: 500; margin: 0; }
  #gate p { font-size: 14px; line-height: 1.8; color: #B3AE97; margin: 0; max-width: 30em; }
  #gate button {
    appearance: none; border: 1px solid #D98B44; background: transparent; color: #D98B44;
    font-family: inherit; font-size: 15px; padding: 13px 30px; border-radius: 4px; cursor: pointer;
  }
  code { background: #2A281C; padding: 2px 6px; border-radius: 3px; font-size: 13px; }
</style>
</head>
<body>

<div id="view">
  <video id="cam" autoplay playsinline muted></video>
  <canvas id="cv"></canvas>
</div>

<div id="status">
  遺構に向けて、<b>ドラッグで位置</b>・<b>2本指で大きさ</b>を合わせてください
</div>

<div id="panel" class="collapsed">
  <div id="handle">
    <span>調整パネル</span>
    <b id="handle-label">開く</b>
  </div>

  <div class="row">
    <label for="op">濃さ</label>
    <input type="range" id="op" min="0" max="100" value="100">
    <output id="op-o">100%</output>
  </div>
  <div class="row">
    <label for="yaw">向き</label>
    <input type="range" id="yaw" min="-180" max="180" value="0">
    <output id="yaw-o">0°</output>
  </div>
  <div class="row">
    <label for="pitch">見上げ</label>
    <input type="range" id="pitch" min="-30" max="40" value="-6">
    <output id="pitch-o">-6°</output>
  </div>
  <div class="row">
    <label for="sc">大きさ</label>
    <input type="range" id="sc" min="20" max="300" value="100">
    <output id="sc-o">100%</output>
  </div>

  <div class="btns">
    <button id="b-workers" class="on">作業員</button>
    <button id="b-smoke" class="on">煙</button>
    <button id="b-stone">石垣</button>
    <button id="b-reset">リセット</button>
  </div>
</div>

<div id="gate">
  <h1 id="gate-title">カメラを使います</h1>
  <p id="gate-msg">遺構にかざすと、明治28年の製錬所が重なって表示されます。</p>
  <button id="gate-btn">カメラを開始</button>
</div>

<script>
(function () {
  "use strict";

  // Self-contained: no external libraries. The renderer is the same flat-shaded painter's-algorithm
  // pipeline as the desk-side verification view, drawn over the live camera feed instead of a photo.

  var video = document.getElementById('cam');
  var canvas = document.getElementById('cv');
  var ctx = canvas.getContext('2d');
  var statusEl = document.getElementById('status');
  var gate = document.getElementById('gate');

  var C = {
    timber:  [110, 91, 68],  timberD: [86, 70, 50],
    roof:    [78, 78, 73],   roofD:   [62, 62, 58],
    stone:   [124, 122, 102], stoneD: [88, 87, 66],
    brick:   [124, 86, 65],  dark:    [44, 40, 35],
    cloth:   [92, 98, 106],  skin:    [186, 156, 125]
  };
  var LIGHT = norm([0.42, 0.80, 0.43]);

  function norm(v) {
    var l = Math.sqrt(v[0]*v[0] + v[1]*v[1] + v[2]*v[2]) || 1;
    return [v[0]/l, v[1]/l, v[2]/l];
  }
  function centroid(p) {
    var x=0,y=0,z=0;
    for (var i=0;i<p.length;i++){ x+=p[i][0]; y+=p[i][1]; z+=p[i][2]; }
    return [x/p.length, y/p.length, z/p.length];
  }
  function faceNormal(p) {
    var a=[p[1][0]-p[0][0],p[1][1]-p[0][1],p[1][2]-p[0][2]];
    var b=[p[2][0]-p[0][0],p[2][1]-p[0][1],p[2][2]-p[0][2]];
    return norm([a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]);
  }
  function addFace(bucket, pts, color, centre) {
    var n = faceNormal(pts), fc = centroid(pts);
    if (n[0]*(fc[0]-centre[0]) + n[1]*(fc[1]-centre[1]) + n[2]*(fc[2]-centre[2]) < 0) {
      pts = pts.slice().reverse(); n = faceNormal(pts);
    }
    bucket.push({ p: pts, n: n, c: color });
  }
  function addBox(bucket, cx, cy, cz, w, h, d, color, rotX) {
    var hw=w/2, hh=h/2, hd=d/2;
    var local=[[-hw,-hh,-hd],[hw,-hh,-hd],[hw,hh,-hd],[-hw,hh,-hd],
               [-hw,-hh,hd],[hw,-hh,hd],[hw,hh,hd],[-hw,hh,hd]];
    var ca=Math.cos(rotX||0), sa=Math.sin(rotX||0);
    var v = local.map(function (p) {
      return [p[0]+cx, (p[1]*ca - p[2]*sa)+cy, (p[1]*sa + p[2]*ca)+cz];
    });
    [[0,1,2,3],[5,4,7,6],[1,5,6,2],[4,0,3,7],[3,2,6,7],[4,5,1,0]].forEach(function (q) {
      addFace(bucket, [v[q[0]],v[q[1]],v[q[2]],v[q[3]]], color, [cx,cy,cz]);
    });
  }
  function addPrism(bucket, cx, cy, cz, rBot, rTop, h, sides, color) {
    var bot=[], top=[];
    for (var i=0;i<sides;i++) {
      var a = i/sides*Math.PI*2;
      bot.push([cx+Math.cos(a)*rBot, cy-h/2, cz+Math.sin(a)*rBot]);
      top.push([cx+Math.cos(a)*rTop, cy+h/2, cz+Math.sin(a)*rTop]);
    }
    for (var j=0;j<sides;j++) {
      var k=(j+1)%sides;
      addFace(bucket, [bot[j],bot[k],top[k],top[j]], color, [cx,cy,cz]);
    }
    addFace(bucket, top.slice(), color, [cx,cy,cz]);
  }

  var terraceFaces = [], buildFaces = [];
  var TIER_H = 4.2, TIER_D = 8.5, SITE_W = 62, tierY = [];
  for (var i=0;i<5;i++) {
    var y=i*TIER_H, z=-i*TIER_D;
    tierY.push(y);
    addBox(terraceFaces, 0, y+TIER_H/2, z+TIER_D/2, SITE_W-i*4, TIER_H, 1.6, i%2?C.stoneD:C.stone);
    addBox(terraceFaces, 0, y+TIER_H, z, SITE_W-i*4, 0.7, TIER_D, C.stoneD);
    if (i === 2) for (var a=-2;a<=3;a++) {
      addBox(terraceFaces, a*5.6-2, y+TIER_H/2-0.3, z+TIER_D/2+0.5, 2.4, 2.6, 0.9, C.dark);
    }
  }

  function addShed(bucket, ox, oy, oz, w, d, eaveH, rise, darkRoof) {
    var roofC = darkRoof ? C.roofD : C.roof;
    addBox(bucket, ox, oy+eaveH/2, oz, w, eaveH, d, C.timber);
    for (var s=1;s<=3;s++) addBox(bucket, ox, oy+eaveH*(s/4), oz, w+0.12, 0.18, d+0.12, C.timberD);
    var cols = Math.max(3, Math.round(w/3.4));
    for (var c=0;c<cols;c++) {
      var wx = ox - w/2 + w*(c+0.5)/cols;
      addBox(bucket, wx, oy+eaveH*0.62, oz+d/2+0.02, 1.15, 1.5, 0.2, C.dark);
      addBox(bucket, wx, oy+eaveH*0.62, oz-d/2-0.02, 1.15, 1.5, 0.2, C.dark);
    }
    var slope = Math.sqrt((d/2)*(d/2) + rise*rise), ang = Math.atan2(rise, d/2);
    addBox(bucket, ox, oy+eaveH+rise/2, oz+d/4, w+1.4, 0.26, slope+0.5, roofC, ang);
    addBox(bucket, ox, oy+eaveH+rise/2, oz-d/4, w+1.4, 0.26, slope+0.5, roofC, -ang);
    [1,-1].forEach(function (sgn) {
      var x = ox + sgn*w/2;
      addFace(bucket, [[x,oy+eaveH,oz-d/2],[x,oy+eaveH,oz+d/2],[x,oy+eaveH+rise,oz]],
              C.timber, [ox, oy+eaveH, oz]);
    });
  }

  addShed(buildFaces, -9, tierY[3]+0.35, -3*TIER_D, 26, 11, 4.6, 3.1, false);
  addShed(buildFaces, 14, tierY[3]+0.35, -3*TIER_D-0.5, 16, 9, 4.1, 2.6, true);
  addShed(buildFaces, -16, tierY[2]+0.35, -2*TIER_D+0.5, 12, 7.5, 3.4, 2.1, false);

  var SX = 21.5, SZ = -3*TIER_D-1, SB = tierY[3]+0.35;
  addPrism(buildFaces, SX, SB+5.75, SZ, 1.35, 0.85, 11.5, 8, C.brick);
  addPrism(buildFaces, SX, SB+11.6, SZ, 1.05, 1.05, 0.6, 8, C.dark);
  var chimneyTop = [SX, SB+12, SZ];

  var workers = [
    { y: tierY[3]+0.35, z: -3*TIER_D+6.5, x0:-18, x1:6,  spd: 1.5,  x:-18, t:0.1 },
    { y: tierY[3]+0.35, z: -3*TIER_D+5.2, x0:8,   x1:20, spd:-1.1,  x:20,  t:0.5 },
    { y: tierY[2]+0.35, z: -2*TIER_D+5.0, x0:-22, x1:-4, spd: 1.2,  x:-22, t:0.8 },
    { y: tierY[2]+0.35, z: -2*TIER_D+6.2, x0:2,   x1:18, spd:-1.35, x:18,  t:0.3 }
  ];
  function workerFaces() {
    var f = [];
    workers.forEach(function (w) {
      var yy = w.y + Math.abs(Math.sin(w.t))*0.06;
      addBox(f, w.x, yy+1.02, w.z, 0.52, 0.86, 0.32, C.cloth);
      addBox(f, w.x, yy+0.31, w.z, 0.44, 0.62, 0.28, C.dark);
      addBox(f, w.x, yy+1.60, w.z, 0.34, 0.34, 0.30, C.skin);
      addBox(f, w.x, yy+1.79, w.z, 0.44, 0.10, 0.36, C.dark);
    });
    return f;
  }

  var puffs = [];
  for (var s2=0; s2<18; s2++) puffs.push({ t: s2/18 });

  // ---------- camera + transform ----------
  var view = { azim: 0, elev: -0.105, dist: 105, tx: 4, ty: 12, tz: -14 };
  var xform = { scale: 1, ox: 0, oy: 0, yaw: 0 };
  var show = { workers: true, smoke: true, stone: false };
  var FOV = 46 * Math.PI/180;
  var dpr = Math.min(window.devicePixelRatio || 1, 2);

  function camBasis(W, H) {
    var ce=Math.cos(view.elev), se=Math.sin(view.elev);
    var ca=Math.cos(view.azim), sa=Math.sin(view.azim);
    var pos=[view.tx+view.dist*ce*sa, view.ty+view.dist*se, view.tz+view.dist*ce*ca];
    var f=norm([view.tx-pos[0], view.ty-pos[1], view.tz-pos[2]]);
    var r=norm([-f[2],0,f[0]]);
    var u=[r[1]*f[2]-r[2]*f[1], r[2]*f[0]-r[0]*f[2], r[0]*f[1]-r[1]*f[0]];
    return { pos:pos, f:f, r:r, u:u, F:(H/2)/Math.tan(FOV/2), W:W, H:H };
  }

  function toView(p, cam) {
    var s = xform.scale;
    var mx=p[0]*s, my=p[1]*s, mz=p[2]*s;
    var c=Math.cos(xform.yaw), sn=Math.sin(xform.yaw);
    var wx = mx*c + mz*sn, wz = -mx*sn + mz*c;
    var dx=wx-cam.pos[0], dy=my-cam.pos[1], dz=wz-cam.pos[2];
    // offsets applied in camera space so dragging moves the model parallel to the screen
    return [dx*cam.r[0]+dy*cam.r[1]+dz*cam.r[2] + xform.ox,
            dx*cam.u[0]+dy*cam.u[1]+dz*cam.u[2] + xform.oy,
            dx*cam.f[0]+dy*cam.f[1]+dz*cam.f[2]];
  }

  function shade(c, n) {
    var l = n[0]*LIGHT[0] + n[1]*LIGHT[1] + n[2]*LIGHT[2];
    var k = 0.52 + 0.48*Math.max(0, l);
    return 'rgb('+Math.round(c[0]*k)+','+Math.round(c[1]*k)+','+Math.round(c[2]*k)+')';
  }

  function syncSize() {
    var w = Math.floor(canvas.clientWidth), h = Math.floor(canvas.clientHeight);
    if (!w || !h) return false;
    if (canvas.width !== Math.floor(w*dpr) || canvas.height !== Math.floor(h*dpr)) {
      canvas.width = Math.floor(w*dpr); canvas.height = Math.floor(h*dpr);
    }
    return true;
  }

  function render() {
    if (!syncSize()) return;
    var W = canvas.clientWidth, H = canvas.clientHeight;
    ctx.setTransform(dpr,0,0,dpr,0,0);
    ctx.clearRect(0,0,W,H);

    var cam = camBasis(W,H);
    var batch = [];
    if (show.stone) batch.push(terraceFaces);
    batch.push(buildFaces);
    if (show.workers) batch.push(workerFaces());

    var draw = [];
    batch.forEach(function (list) {
      for (var i=0;i<list.length;i++) {
        var face=list[i], pts=face.p, n=pts.length, vs=[], sum=0, ok=true;
        for (var j=0;j<n;j++) {
          var v = toView(pts[j], cam);
          if (v[2] < 1.2) { ok=false; break; }
          sum += v[2];
          vs.push([v[0]/v[2]*cam.F + W/2, -v[1]/v[2]*cam.F + H/2]);
        }
        if (!ok) continue;
        var area=0;
        for (var k=0;k<n;k++) { var p1=vs[k],p2=vs[(k+1)%n]; area += p1[0]*p2[1]-p2[0]*p1[1]; }
        if (area >= 0) continue;
        draw.push({ d:sum/n, v:vs, s:shade(face.c, face.n) });
      }
    });
    draw.sort(function (a,b) { return b.d - a.d; });

    for (var m=0;m<draw.length;m++) {
      var it = draw[m];
      ctx.beginPath();
      ctx.moveTo(it.v[0][0], it.v[0][1]);
      for (var q=1;q<it.v.length;q++) ctx.lineTo(it.v[q][0], it.v[q][1]);
      ctx.closePath();
      ctx.fillStyle = it.s; ctx.fill();
      ctx.strokeStyle = it.s; ctx.lineWidth = 0.7; ctx.stroke();
    }

    if (show.smoke) {
      var dr = [];
      puffs.forEach(function (p) {
        var t=p.t;
        var v = toView([chimneyTop[0]+t*8.5+Math.sin(t*7)*1.1, chimneyTop[1]+t*17, chimneyTop[2]+t*2.8], cam);
        if (v[2] < 1.2) return;
        dr.push({ d:v[2], x:v[0]/v[2]*cam.F+W/2, y:-v[1]/v[2]*cam.F+H/2,
                  r:(1.3+t*5.4)*xform.scale*cam.F/v[2], a:0.72*(1-t*0.92) });
      });
      dr.sort(function (a,b) { return b.d-a.d; });
      dr.forEach(function (p) {
        var r = Math.max(1.5, p.r);
        var g = ctx.createRadialGradient(p.x,p.y,r*0.15,p.x,p.y,r);
        g.addColorStop(0, 'rgba(230,227,219,'+p.a.toFixed(3)+')');
        g.addColorStop(0.55, 'rgba(224,220,211,'+(p.a*0.55).toFixed(3)+')');
        g.addColorStop(1, 'rgba(216,212,202,0)');
        ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2);
        ctx.fillStyle = g; ctx.fill();
      });
    }
  }

  // ---------- touch: drag to move, pinch to scale ----------
  var pts = {}, pinchStart = 0, scaleStart = 1;
  canvas.addEventListener('pointerdown', function (e) {
    canvas.setPointerCapture(e.pointerId);
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    var ids = Object.keys(pts);
    if (ids.length === 2) {
      pinchStart = dist2(pts[ids[0]], pts[ids[1]]);
      scaleStart = xform.scale;
    }
  });
  canvas.addEventListener('pointermove', function (e) {
    if (!pts[e.pointerId]) return;
    var ids = Object.keys(pts);
    if (ids.length === 1) {
      var W = canvas.clientWidth, H = canvas.clientHeight;
      var F = (H/2)/Math.tan(FOV/2);
      var k = view.dist / F;
      xform.ox += (e.clientX - pts[e.pointerId].x) * k;
      xform.oy -= (e.clientY - pts[e.pointerId].y) * k;
    }
    pts[e.pointerId] = { x: e.clientX, y: e.clientY };
    if (ids.length === 2 && pinchStart > 0) {
      var d = dist2(pts[ids[0]], pts[ids[1]]);
      var ns = Math.max(0.2, Math.min(3, scaleStart * d / pinchStart));
      xform.scale = ns;
      els.sc.value = Math.round(ns*100);
      document.getElementById('sc-o').textContent = els.sc.value + '%';
    }
  });
  ['pointerup','pointercancel'].forEach(function (ev) {
    canvas.addEventListener(ev, function (e) { delete pts[e.pointerId]; pinchStart = 0; });
  });
  function dist2(a,b) { return Math.hypot(a.x-b.x, a.y-b.y); }

  // ---------- controls ----------
  var els = {
    op: document.getElementById('op'), yaw: document.getElementById('yaw'),
    pitch: document.getElementById('pitch'), sc: document.getElementById('sc')
  };
  els.op.addEventListener('input', function () {
    canvas.style.opacity = this.value/100;
    document.getElementById('op-o').textContent = this.value + '%';
  });
  els.yaw.addEventListener('input', function () {
    xform.yaw = this.value * Math.PI/180;
    document.getElementById('yaw-o').textContent = this.value + '°';
  });
  els.pitch.addEventListener('input', function () {
    view.elev = this.value * Math.PI/180;
    document.getElementById('pitch-o').textContent = this.value + '°';
  });
  els.sc.addEventListener('input', function () {
    xform.scale = this.value/100;
    document.getElementById('sc-o').textContent = this.value + '%';
  });

  function toggleBtn(id, key) {
    var b = document.getElementById(id);
    b.addEventListener('click', function () {
      show[key] = !show[key];
      b.classList.toggle('on', show[key]);
    });
  }
  toggleBtn('b-workers','workers');
  toggleBtn('b-smoke','smoke');
  toggleBtn('b-stone','stone');

  document.getElementById('b-reset').addEventListener('click', function () {
    xform = { scale: 1, ox: 0, oy: 0, yaw: 0 };
    view.elev = -0.105;
    els.op.value = 100; els.yaw.value = 0; els.pitch.value = -6; els.sc.value = 100;
    canvas.style.opacity = 1;
    document.getElementById('op-o').textContent = '100%';
    document.getElementById('yaw-o').textContent = '0°';
    document.getElementById('pitch-o').textContent = '-6°';
    document.getElementById('sc-o').textContent = '100%';
  });

  var panel = document.getElementById('panel');
  document.getElementById('handle').addEventListener('click', function () {
    var c = panel.classList.toggle('collapsed');
    document.getElementById('handle-label').textContent = c ? '開く' : '閉じる';
  });

  // ---------- loop ----------
  var last = performance.now();
  function tick(now) {
    requestAnimationFrame(tick);
    var dt = Math.min((now - last)/1000, 0.05);
    last = now;
    workers.forEach(function (w) {
      w.x += w.spd*dt;
      if (w.spd > 0 && w.x > w.x1) w.x = w.x0;
      if (w.spd < 0 && w.x < w.x0) w.x = w.x1;
      w.t += dt*6;
    });
    puffs.forEach(function (p) { p.t += dt*0.13; if (p.t > 1) p.t -= 1; });
    render();
  }

  // ---------- camera start ----------
  function showGate(title, msg, btnText, onClick) {
    document.getElementById('gate-title').textContent = title;
    document.getElementById('gate-msg').innerHTML = msg;
    var btn = document.getElementById('gate-btn');
    if (btnText) { btn.style.display = ''; btn.textContent = btnText; btn.onclick = onClick; }
    else { btn.style.display = 'none'; }
    gate.classList.add('show');
  }

  var secure = location.protocol === 'https:' ||
               location.hostname === 'localhost' || location.hostname === '127.0.0.1';

  function startCamera() {
    navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
      audio: false
    }).then(function (stream) {
      video.srcObject = stream;
      gate.classList.remove('show');
      requestAnimationFrame(tick);
      setTimeout(function () { statusEl.classList.add('hide'); }, 9000);
    }).catch(function (err) {
      var name = err && err.name ? err.name : '';
      if (name === 'NotAllowedError') {
        showGate('カメラが許可されませんでした',
          'ブラウザのアドレスバーの鍵アイコンから、このサイトのカメラを「許可」にして再読み込みしてください。',
          '再試行', startCamera);
      } else if (name === 'NotFoundError') {
        showGate('カメラが見つかりません', 'この端末で背面カメラが利用できるか確認してください。', '再試行', startCamera);
      } else {
        showGate('カメラを起動できません', String(err), '再試行', startCamera);
      }
    });
  }

  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
    showGate('カメラに対応していません', 'Chrome または Safari の最新版で開いてください。', null, null);
  } else if (!secure) {
    showGate('HTTPSで開いてください',
      'カメラは安全な接続でのみ使えます。<br>いま開いているアドレス: <code>' + location.protocol + '//' + location.host + '</code><br><br>GitHub Pages などのHTTPSのURLから開いてください。',
      null, null);
  } else {
    showGate('カメラを使います', '遺構にかざすと、明治28年の製錬所が重なって表示されます。', 'カメラを開始', startCamera);
  }
})();
</script>
